name: CI/CD Bandjoun

on:
  push:
    branches: [ main, eks-deployment ]
  pull_request:
    branches: [ main ]

env:
  BACKEND_IMAGE: wilses10/bandjoun-backend
  FRONTEND_IMAGE: wilses10/bandjoun-frontend
  AWS_REGION: us-east-1
  EKS_CLUSTER: bandjoun-eks

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.run_number }} ./backend
          docker tag $BACKEND_IMAGE:${{ github.run_number }} $BACKEND_IMAGE:latest

      - name: Build Frontend Image
        run: |
          docker build -t $FRONTEND_IMAGE:${{ github.run_number }} ./frontend
          docker tag $FRONTEND_IMAGE:${{ github.run_number }} $FRONTEND_IMAGE:latest

      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.run_number }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.run_number }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push Images to Docker Hub
        run: |
          docker push $BACKEND_IMAGE:${{ github.run_number }}
          docker push $BACKEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:${{ github.run_number }}
          docker push $FRONTEND_IMAGE:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply MySQL Secret to EKS
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: mysql-secret
            namespace: bandjoun
          type: Opaque
          stringData:
            MYSQL_ROOT_PASSWORD: "${{ secrets.MYSQL_ROOT_PASSWORD }}"
            MYSQL_USER: "${{ secrets.MYSQL_USER }}"
            MYSQL_PASSWORD: "${{ secrets.MYSQL_PASSWORD }}"
            MYSQL_DATABASE: "${{ secrets.MYSQL_DATABASE }}"
            MYSQL_HOST: "${{ secrets.MYSQL_HOST }}"
          EOF

      - name: Update K8s manifests with new image tags
        run: |
          sed -i "s|image: $BACKEND_IMAGE:.*|image: $BACKEND_IMAGE:${{ github.run_number }}|" k8s/backend-deployment.yaml
          sed -i "s|image: $FRONTEND_IMAGE:.*|image: $FRONTEND_IMAGE:${{ github.run_number }}|" k8s/frontend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config --global user.email "github-actions@bandjoun.ci"
          git config --global user.name "GitHub Actions"
          git add k8s/backend-deployment.yaml k8s/frontend-deployment.yaml
          git diff --staged --quiet || git commit -m "CI: update images to build ${{ github.run_number }} [skip ci]"
          git push